server {
    listen 80;
    server_name localhost;

    # Directorio root para el frontend
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Ruteo principal para Single Page Application (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para las peticiones a la API del backend
    location /api/ {
        proxy_pass http://ares_backend:8000/api/;
        
        # Headers esenciales para que el backend reconozca la solicitud original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar timeout prematuro por procesamiento de LLM / TTS
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
